# Build memory
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric / Minecraft — match the upstream Middle-earth mod's runtime
# (https://fabricmc.net/develop for current values)
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.16.14
# Fabric API pinned to what the LOTR: Fate of Middle-earth pack ships, so we
# compile against exactly what the server runs. Upstream builds against
# 0.129.0+1.21.8; newer is compatible.
fabric_version=0.136.1+1.21.8
loom_version=1.11-SNAPSHOT

# Andúril mod metadata
mod_version=0.1.0
maven_group=org.middleearth
archives_base_name=anduril
modid=anduril
